<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 30 Quest</title>
  <!-- Ícones para iOS e Android PWA -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png?v=3">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Configuração das Cores Personalizadas no Tailwind (Tema Claro) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            quest: {
              pink1: '#F79FC3',
              pink2: '#F5C2CB',
              dark: '#D72E60',
              pink3: '#E199B3',
              pink4: '#F48AA6',
              pink5: '#F68C9F',
              bgLight: '#FFF5F7',      /* Fundo claro bem suave */
              cardLight: '#FFFFFF',    /* Card branco limpo */
              cardHover: '#FDF0F3',
              textDark: '#4A1525',     /* Texto escuro em tom bordô para leitura perfeita */
              textMuted: '#8C3A52'
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Estilização para barras de rolagem suaves e toque mobile */
    body { -webkit-tap-highlight-color: transparent; }
    
    /* Personalização do checkbox no tema claro */
    input[type="checkbox"]:checked {
      background-color: #D72E60;
      border-color: #D72E60;
    }
  </style>
</head>
<body class="bg-quest-bgLight text-quest-textDark font-sans min-h-screen pb-20">

  <!-- Header / Status do Cofrinho -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-quest-pink2 p-4 shadow-sm">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-quest-dark flex items-center gap-2">
          <i data-lucide="crown" class="w-6 h-6 text-quest-dark"></i> The 30 Quest
        </h1>
        <p class="text-xs text-quest-textMuted">Rumo aos 30 em alta performance</p>
      </div>
      <div class="bg-quest-bgLight border border-quest-pink1/60 px-3 py-1.5 rounded-2xl flex items-center gap-2 shadow-inner">
        <i data-lucide="piggy-bank" class="w-5 h-5 text-quest-dark animate-pulse"></i>
        <span id="saldo-total" class="text-lg font-extrabold text-quest-dark">R$ 0,00</span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Card de Progresso do Dia -->
    <section class="bg-quest-cardLight border border-quest-pink2 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-quest-textDark flex items-center gap-1.5 flex-wrap">
          <i data-lucide="calendar" class="w-4 h-4 text-quest-dark"></i> 
          <span>Missões de Hoje</span>
          <span id="data-hoje" class="text-xs font-normal text-quest-textMuted"></span>
        </h2>
        <span id="ganho-hoje" class="text-sm font-semibold text-quest-dark bg-quest-bgLight border border-quest-pink1/60 px-2.5 py-0.5 rounded-full">
          + R$ 0,00
        </span>
      </div>

      <!-- Barra de Progresso Diária -->
      <div class="w-full bg-quest-bgLight h-2.5 rounded-full overflow-hidden border border-quest-pink2">
        <div id="barra-progresso" class="bg-gradient-to-r from-quest-pink4 to-quest-dark h-full w-0 transition-all duration-500"></div>
      </div>

      <!-- Lista de Checkboxes de Hábitos -->
      <div class="space-y-2 pt-2">
        <label class="flex items-center justify-between p-3 bg-quest-bgLight/50 hover:bg-quest-cardHover border border-quest-pink2/70 rounded-xl cursor-pointer transition">
          <div class="flex items-center gap-3">
            <input type="checkbox" id="task-sugar" onchange="toggleHabit('sugar')" class="w-5 h-5 accent-quest-dark rounded cursor-pointer">
            <span class="text-sm font-medium text-quest-textDark">Zero Açúcar</span>
          </div>
          <span class="text-xs font-bold text-quest-dark">+ R$ 1,00</span>
        </label>

        <label class="flex items-center justify-between p-3 bg-quest-bgLight/50 hover:bg-quest-cardHover border border-quest-pink2/70 rounded-xl cursor-pointer transition">
          <div class="flex items-center gap-3">
            <input type="checkbox" id="task-gluten" onchange="toggleHabit('gluten')" class="w-5 h-5 accent-quest-dark rounded cursor-pointer">
            <span class="text-sm font-medium text-quest-textDark">Zero Glúten & Laticínios</span>
          </div>
          <span class="text-xs font-bold text-quest-dark">+ R$ 2,00</span>
        </label>

        <label class="flex items-center justify-between p-3 bg-quest-bgLight/50 hover:bg-quest-cardHover border border-quest-pink2/70 rounded-xl cursor-pointer transition">
          <div class="flex items-center gap-3">
            <input type="checkbox" id="task-stretch" onchange="toggleHabit('stretch')" class="w-5 h-5 accent-quest-dark rounded cursor-pointer">
            <span class="text-sm font-medium text-quest-textDark">Alongamento</span>
          </div>
          <span class="text-xs font-bold text-quest-dark">+ R$ 1,00</span>
        </label>

        <label class="flex items-center justify-between p-3 bg-quest-bgLight/50 hover:bg-quest-cardHover border border-quest-pink2/70 rounded-xl cursor-pointer transition">
          <div class="flex items-center gap-3">
            <input type="checkbox" id="task-workout" onchange="toggleHabit('workout')" class="w-5 h-5 accent-quest-dark rounded cursor-pointer">
            <span class="text-sm font-medium text-quest-textDark">Treino (Musculação/Aeróbico)</span>
          </div>
          <span class="text-xs font-bold text-quest-dark">+ R$ 1,00</span>
        </label>
      </div>
    </section>

    <!-- Banner Perfect Week -->
    <section class="bg-gradient-to-r from-quest-pink2/40 to-quest-bgLight border border-quest-pink1 rounded-2xl p-4 flex justify-between items-center shadow-sm">
      <div class="space-y-1">
        <h3 class="text-sm font-bold text-quest-dark flex items-center gap-1.5">
          <i data-lucide="trophy" class="w-4 h-4 text-quest-dark"></i> Perfect Week (5 Dias Seguidos)
        </h3>
        <p class="text-xs text-quest-textMuted">Complete 5 dias perfeitos na sequência para +R$ 5,00</p>
      </div>
      <div class="text-right">
        <span id="perfect-days-count" class="text-xl font-black text-quest-dark">0/5</span>
      </div>
    </section>

    <!-- Histórico de Registros Recentes -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-quest-textDark flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4 text-quest-dark"></i> Histórico
        </h2>
      </div>
      <div id="historico-lista" class="space-y-2">
        <!-- Renderizado dinamicamente via JS -->
      </div>
      <!-- Botão Ver Mais / Ver Menos -->
      <button id="btn-ver-mais" onclick="toggleShowAllHistory()" class="hidden w-full py-2 bg-quest-bgLight hover:bg-quest-cardHover border border-quest-pink1 text-quest-dark text-xs font-bold rounded-xl transition flex items-center justify-center gap-1">
        <span id="btn-ver-mais-texto">Ver mais</span>
        <i id="btn-ver-mais-icone" data-lucide="chevron-down" class="w-4 h-4"></i>
      </button>
    </section>

    <!-- Loja de Prêmios -->
    <section class="space-y-3">
      <h2 class="font-bold text-quest-textDark flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-4 h-4 text-quest-dark"></i> Lista de Prêmios
      </h2>

      <div class="grid grid-cols-1 gap-2.5">
        <div class="flex justify-between items-center p-3 bg-quest-cardLight border border-quest-pink2 rounded-xl shadow-sm">
          <div>
            <p class="text-sm font-semibold text-quest-textDark">Caneleira com elástico</p>
            <p class="text-xs text-quest-textMuted">Shopee • R$ 39,99</p>
          </div>
          <button onclick="redeemReward(39.99, 'Caneleira com elástico')" class="px-3 py-1.5 bg-quest-dark hover:bg-quest-pink4 active:scale-95 text-xs font-bold text-white rounded-lg transition shadow-sm">Resgatar</button>
        </div>
      </div>
    </section>

    <!-- Gerenciamento de Backup -->
    <section class="bg-quest-cardLight border border-quest-pink2/80 rounded-2xl p-4 shadow-sm space-y-3">
      <h2 class="font-bold text-quest-textDark flex items-center gap-2 text-sm">
        <i data-lucide="database" class="w-4 h-4 text-quest-dark"></i> Dados e Backup
      </h2>
      <div class="flex gap-2">
        <button onclick="exportBackup()" class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 bg-quest-bgLight border border-quest-pink1 hover:bg-quest-cardHover text-quest-dark text-xs font-bold rounded-xl transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar
        </button>
        <label class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 bg-quest-bgLight border border-quest-pink1 hover:bg-quest-cardHover text-quest-dark text-xs font-bold rounded-xl transition cursor-pointer">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i> Importar
          <input type="file" id="import-file" onchange="importBackup(event)" accept=".json" class="hidden">
        </label>
      </div>
    </section>

  </main>

  <!-- Lógica JavaScript -->
  <script>
    // Configurações de Hábitos
    const HABIT_VALUES = { sugar: 1.0, gluten: 2.0, stretch: 1.0, workout: 1.0 };
    const HABIT_LABELS = { sugar: 'Zero Açúcar', gluten: 'Zero Glúten/Laticínios', stretch: 'Alongamento', workout: 'Treino' };
    const TODAY_KEY = new Date().toISOString().split('T')[0];

    // Estado do Botão de Expandir Histórico
    let showAllHistory = false;

    // Estado da Aplicação
    let appState = JSON.parse(localStorage.getItem('the30quest_state')) || {
      saldoTotal: 0.0,
      historicoDiario: {},
      resgates: []
    };

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadTodayState();
      updateUI();
    });

    function playCuteSuccessSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        // Notas fofas (Dó 5 -> Mí 5 -> Sol 5 -> Dó 6)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const startTime = ctx.currentTime;

        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine'; // Timbre suave e fofo
          osc.frequency.setValueAtTime(freq, startTime + index * 0.08);

          gain.gain.setValueAtTime(0.15, startTime + index * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + index * 0.08 + 0.2);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime + index * 0.08);
          osc.stop(startTime + index * 0.08 + 0.2);
        });
      } catch (e) {
        console.log('AudioContext Error:', e);
      }
    }

    function loadTodayState() {
      const todayData = appState.historicoDiario[TODAY_KEY] || { sugar: false, gluten: false, stretch: false, workout: false };
      Object.keys(HABIT_VALUES).forEach(habit => {
        document.getElementById(`task-${habit}`).checked = todayData[habit] || false;
      });
    }

    function toggleHabit(habit) {
      if (!appState.historicoDiario[TODAY_KEY]) {
        appState.historicoDiario[TODAY_KEY] = { sugar: false, gluten: false, stretch: false, workout: false };
      }

      const todayBefore = { ...appState.historicoDiario[TODAY_KEY] };
      const wasPerfectBefore = todayBefore.sugar && todayBefore.gluten && todayBefore.stretch && todayBefore.workout;

      const isChecked = document.getElementById(`task-${habit}`).checked;
      appState.historicoDiario[TODAY_KEY][habit] = isChecked;

      const todayAfter = appState.historicoDiario[TODAY_KEY];
      const isPerfectNow = todayAfter.sugar && todayAfter.gluten && todayAfter.stretch && todayAfter.workout;

      // Se acabou de completar todas as tarefas do dia = Toca o som fofo!
      if (!wasPerfectBefore && isPerfectNow) {
        playCuteSuccessSound();
      }

      recalculateBalance();
      saveState();
      updateUI();
    }

    function getPerfectStreakStats() {
      // Ordena as datas cronologicamente
      const sortedDates = Object.keys(appState.historicoDiario).sort();
      
      let currentStreak = 0;
      let perfectWeekBonuses = 0;
      let prevDate = null;

      sortedDates.forEach(dateStr => {
        const habits = appState.historicoDiario[dateStr];
        const isPerfect = habits.sugar && habits.gluten && habits.stretch && habits.workout;

        if (isPerfect) {
          if (prevDate === null) {
            currentStreak = 1;
          } else {
            const prev = new Date(prevDate + 'T00:00:00');
            const curr = new Date(dateStr + 'T00:00:00');
            const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));

            if (diffDays === 1) {
              currentStreak++;
            } else {
              currentStreak = 1;
            }
          }

          if (currentStreak === 5) {
            perfectWeekBonuses += 5.0;
            currentStreak = 0;
          }

          prevDate = dateStr;
        } else {
          currentStreak = 0;
          prevDate = dateStr;
        }
      });

      return { currentStreak, perfectWeekBonuses };
    }

    function recalculateBalance() {
      let total = 0.0;

      Object.entries(appState.historicoDiario).forEach(([date, habits]) => {
        let dayEarnings = 0.0;
        if (habits.sugar) dayEarnings += HABIT_VALUES.sugar;
        if (habits.gluten) dayEarnings += HABIT_VALUES.gluten;
        if (habits.stretch) dayEarnings += HABIT_VALUES.stretch;
        if (habits.workout) dayEarnings += HABIT_VALUES.workout;

        if (habits.sugar && habits.gluten && habits.stretch && habits.workout) {
          dayEarnings = 5.0;
        }

        total += dayEarnings;
      });

      const { perfectWeekBonuses } = getPerfectStreakStats();
      total += perfectWeekBonuses;

      const totalResgatado = appState.resgates.reduce((acc, curr) => acc + curr.valor, 0);
      appState.saldoTotal = total - totalResgatado;
    }

    function redeemReward(valor, nome) {
      if (appState.saldoTotal < valor) {
        alert('Saldo insuficiente no cofrinho para resgatar este prêmio!');
        return;
      }

      if (confirm(`Deseja resgatar "${nome}" por R$ ${valor.toFixed(2)}?`)) {
        appState.resgates.push({ nome, valor, data: new Date().toISOString() });
        recalculateBalance();
        saveState();
        updateUI();
        alert('🎉 Prêmio resgatado com sucesso! Aproveite!');
      }
    }

    function updateUI() {
      const hoje = new Date();
      const dataFormatada = hoje.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
      const diaSemana = hoje.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
      
      document.getElementById('data-hoje').textContent = `(${diaSemana}, ${dataFormatada})`;
      document.getElementById('saldo-total').textContent = `R$ ${appState.saldoTotal.toFixed(2).replace('.', ',')}`;
      
      const todayData = appState.historicoDiario[TODAY_KEY] || {};
      let todayTotal = 0;
      let countChecked = 0;

      Object.keys(HABIT_VALUES).forEach(h => {
        if (todayData[h]) {
          todayTotal += HABIT_VALUES[h];
          countChecked++;
        }
      });

      if (countChecked === 4) todayTotal = 5.0;

      document.getElementById('ganho-hoje').textContent = `+ R$ ${todayTotal.toFixed(2).replace('.', ',')}`;
      document.getElementById('barra-progresso').style.width = `${(countChecked / 4) * 100}%`;

      const { currentStreak } = getPerfectStreakStats();
      document.getElementById('perfect-days-count').textContent = `${currentStreak}/5`;

      renderHistory();
      lucide.createIcons();
    }

    function toggleShowAllHistory() {
      showAllHistory = !showAllHistory;
      renderHistory();
      lucide.createIcons();
    }

    function renderHistory() {
      const container = document.getElementById('historico-lista');
      const btnVerMais = document.getElementById('btn-ver-mais');
      const btnTexto = document.getElementById('btn-ver-mais-texto');
      const btnIcone = document.getElementById('btn-ver-mais-icone');

      container.innerHTML = '';

      const dates = Object.keys(appState.historicoDiario).sort().reverse();

      if (dates.length === 0) {
        container.innerHTML = `<p class="text-xs text-quest-textMuted italic text-center py-2">Nenhum histórico registrado ainda.</p>`;
        btnVerMais.classList.add('hidden');
        return;
      }

      if (dates.length > 5) {
        btnVerMais.classList.remove('hidden');
        if (showAllHistory) {
          btnTexto.textContent = 'Ver menos';
          btnIcone.setAttribute('data-lucide', 'chevron-up');
        } else {
          btnTexto.textContent = `Ver mais (${dates.length - 5} dias)`;
          btnIcone.setAttribute('data-lucide', 'chevron-down');
        }
      } else {
        btnVerMais.classList.add('hidden');
      }

      const visibleDates = showAllHistory ? dates : dates.slice(0, 5);

      visibleDates.forEach(date => {
        const habits = appState.historicoDiario[date];
        const [year, month, day] = date.split('-');
        const formattedDate = `${day}/${month}/${year}`;

        let dayEarnings = 0;
        let doneHabits = [];

        Object.keys(HABIT_VALUES).forEach(h => {
          if (habits[h]) {
            dayEarnings += HABIT_VALUES[h];
            doneHabits.push(HABIT_LABELS[h]);
          }
        });

        const isPerfect = doneHabits.length === 4;
        if (isPerfect) dayEarnings = 5.0;

        const card = document.createElement('div');
        card.className = 'p-3 bg-quest-cardLight border border-quest-pink2 rounded-xl shadow-sm flex justify-between items-start gap-2 text-xs';
        card.innerHTML = `
          <div class="space-y-1 min-w-0 flex-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-bold text-quest-textDark">${formattedDate}</span>
              ${isPerfect ? '<span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-1.5 py-0.2 rounded-full border border-amber-300 shrink-0">Perfect Day ⭐</span>' : ''}
            </div>
            <p class="text-quest-textMuted leading-tight">${doneHabits.length > 0 ? doneHabits.join(', ') : 'Nenhum hábito cumprido'}</p>
          </div>
          <span class="font-bold text-quest-dark text-sm whitespace-nowrap shrink-0">+ R$ ${dayEarnings.toFixed(2).replace('.', ',')}</span>
        `;
        container.appendChild(card);
      });
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `the30quest_backup_${TODAY_KEY}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData.historicoDiario !== undefined) {
            appState = importedData;
            recalculateBalance();
            saveState();
            loadTodayState();
            updateUI();
            alert('✅ Backup restaurado com sucesso!');
          } else {
            alert('⚠️ O arquivo selecionado não é um backup válido do The 30 Quest.');
          }
        } catch (err) {
          alert('❌ Erro ao ler o arquivo de backup.');
        }
      };
      reader.readAsText(file);
    }

    function saveState() {
      localStorage.setItem('the30quest_state', JSON.stringify(appState));
    }
  </script>
</body>
</html>
